[project]
name = "court-notice-monitor"
version = "0.1.0"
description = "Read-only daily sweep of Brazil's electronic judicial domicile: list, triage by type, alert the team, never acknowledge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
keywords = ["legal-tech", "court", "monitoring", "sqlite", "microsoft-graph", "brazil"]
dependencies = ["requests>=2.32"]

[project.scripts]
notice-monitor = "notice_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notice_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter wraps code at 100; long string literals may reach 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
